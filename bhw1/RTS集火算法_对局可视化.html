<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTS 集火算法对局可视化</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #657087;
      --border: #d9dfeb;
      --friendly: #2675d8;
      --friendly-soft: rgba(38, 117, 216, 0.14);
      --enemy: #d24a43;
      --enemy-soft: rgba(210, 74, 67, 0.14);
      --goal: #8c62d5;
      --attack: #e4a11b;
      --success: #2e8b57;
      --shadow: 0 12px 32px rgba(24, 34, 55, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151d;
        --panel: #1a202b;
        --text: #edf1f7;
        --muted: #aab3c3;
        --border: #343d4d;
        --friendly: #64a8ff;
        --friendly-soft: rgba(100, 168, 255, 0.14);
        --enemy: #ff7770;
        --enemy-soft: rgba(255, 119, 112, 0.14);
        --goal: #b895ff;
        --attack: #ffd166;
        --success: #70d69b;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 22px auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 650;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar,
    .metrics,
    .layout {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      align-items: end;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    select { padding: 0 34px 0 10px; }

    button {
      padding: 0 15px;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--friendly);
      background: var(--friendly);
      color: #fff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--friendly), transparent 60%);
      outline-offset: 2px;
    }

    .strategy-note {
      flex: 1 1 280px;
      align-self: center;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    .metrics {
      margin: 12px 0;
    }

    .metric {
      flex: 1 1 170px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 22px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .layout { align-items: stretch; }

    .battlefield-panel {
      flex: 3 1 620px;
      min-width: 0;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 900 / 520;
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel), var(--bg) 45%);
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 11px; height: 11px; border-radius: 50%; }
    .swatch.friendly { background: var(--friendly); }
    .swatch.enemy { background: var(--enemy); }
    .swatch.goal { background: var(--goal); }

    .log-panel {
      flex: 1 1 280px;
      min-width: 0;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .log-panel h2 {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 650;
    }

    #eventLog {
      margin: 0;
      padding-left: 22px;
      max-height: 430px;
      overflow: auto;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    #eventLog li { margin-bottom: 8px; }
    #eventLog li.latest { color: var(--text); font-weight: 600; }

    .result {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 4px solid var(--success);
      background: color-mix(in srgb, var(--success), transparent 90%);
      line-height: 1.5;
    }

    .result[hidden] { display: none; }

    @media (max-width: 720px) {
      main { width: min(100% - 18px, 680px); margin: 12px auto; }
      .toolbar { align-items: stretch; }
      .toolbar label, .toolbar button { flex: 1 1 140px; }
      .strategy-note { flex-basis: 100%; }
      .battlefield-panel, .log-panel { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>RTS 集火策略对局</h1>
    <p class="subtitle">双方单位属性完全相同：生命 55、攻击 10、射程 6、移速 2、攻击间隔 2 tick。射程内存在敌人时单位停止移动；敌方始终就近攻击。</p>

    <section class="toolbar" aria-label="模拟控制">
      <label>
        己方策略
        <select id="strategySelect">
          <option value="default">默认算法：就近攻击</option>
          <option value="model">大模型算法：优化集火</option>
        </select>
      </label>
      <label>
        播放速度
        <select id="speedSelect">
          <option value="1100">慢速</option>
          <option value="700" selected>正常</option>
          <option value="350">快速</option>
        </select>
      </label>
      <button id="playButton" class="primary" type="button">播放</button>
      <button id="stepButton" type="button">下一 tick</button>
      <button id="resetButton" type="button">重置</button>
      <div id="strategyNote" class="strategy-note"></div>
    </section>

    <section class="metrics" aria-label="当前状态">
      <div class="metric"><span>当前 tick</span><strong id="tickValue">0</strong></div>
      <div class="metric"><span>己方总生命值</span><strong id="friendlyHpValue">110</strong></div>
      <div class="metric"><span>敌方存活数</span><strong id="enemyAliveValue">2</strong></div>
      <div class="metric"><span>战斗状态</span><strong id="statusValue">移动中</strong></div>
    </section>

    <section class="layout">
      <div class="battlefield-panel">
        <canvas id="battlefield" role="img" aria-label="RTS 对局战场：蓝色为己方单位，红色为敌方单位，紫色为共同目标点"></canvas>
        <div class="legend" aria-label="图例">
          <span><i class="swatch friendly"></i>己方单位</span>
          <span><i class="swatch enemy"></i>敌方单位</span>
          <span><i class="swatch goal"></i>共同目标点 G</span>
          <span>虚线圆：攻击范围</span>
          <span>黄色连线：本 tick 攻击</span>
        </div>
        <div id="resultBox" class="result" aria-live="polite" hidden></div>
      </div>

      <aside class="log-panel">
        <h2>逐 tick 事件</h2>
        <ol id="eventLog" aria-live="polite"></ol>
      </aside>
    </section>
  </main>

  <script>
    (() => {
      const WIDTH = 900;
      const HEIGHT = 520;
      const WORLD_SCALE = 30;
      const GOAL = { x: 450, y: 260 };
      const canvas = document.getElementById('battlefield');
      const ctx = canvas.getContext('2d');
      const strategySelect = document.getElementById('strategySelect');
      const speedSelect = document.getElementById('speedSelect');
      const playButton = document.getElementById('playButton');
      const stepButton = document.getElementById('stepButton');
      const resetButton = document.getElementById('resetButton');
      const tickValue = document.getElementById('tickValue');
      const friendlyHpValue = document.getElementById('friendlyHpValue');
      const enemyAliveValue = document.getElementById('enemyAliveValue');
      const statusValue = document.getElementById('statusValue');
      const eventLog = document.getElementById('eventLog');
      const resultBox = document.getElementById('resultBox');
      const strategyNote = document.getElementById('strategyNote');

      const strategyDescriptions = {
        default: '每个己方单位独立攻击射程内距离最近的敌人；距离相同时选择编号最小的目标。',
        model: '先确定统一的集火目标，再协调可攻击单位持续攻击它，尽早减少敌方存活数量。'
      };

      let state;
      let playing = false;
      let timer = null;

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function createScenario() {
        return {
          tick: 0,
          ended: false,
          winner: null,
          attacks: [],
          units: [
            unit('F1', 'friendly', 120, 210, 55, 10, 2, 6, 2),
            unit('F2', 'friendly', 120, 310, 55, 10, 2, 6, 2),
            unit('E1', 'enemy', 780, 210, 55, 10, 2, 6, 2),
            unit('E2', 'enemy', 780, 310, 55, 10, 2, 6, 2)
          ],
          log: ['初始状态：双方尚未进入射程，所有单位均为 Ready。']
        };
      }

      function unit(id, team, x, y, hp, attack, interval, range, speed) {
        return {
          id,
          team,
          x,
          y,
          hp,
          maxHp: hp,
          attack,
          armor: 0,
          interval,
          cooldown: 0,
          range,
          speed,
          alive: true
        };
      }

      function alive(team) {
        return state.units.filter(u => u.alive && (!team || u.team === team));
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function damage(attacker, target) {
        return Math.max(0.5, attacker.attack - target.armor);
      }

      function candidatesFor(attacker) {
        const otherTeam = attacker.team === 'friendly' ? 'enemy' : 'friendly';
        return alive(otherTeam).filter(target => distance(attacker, target) <= attacker.range * WORLD_SCALE + 1e-9);
      }

      function defaultActions() {
        const actions = [];
        const ready = alive('friendly').filter(u => u.cooldown === 0);

        for (const attacker of ready) {
          const candidates = candidatesFor(attacker).sort((a, b) =>
            distance(attacker, a) - distance(attacker, b) || a.id.localeCompare(b.id)
          );
          if (candidates.length) actions.push({ attacker, target: candidates[0] });
        }
        return actions;
      }

      function modelActions() {
        const actions = [];
        const virtualHp = new Map(alive('enemy').map(u => [u.id, u.hp]));
        const ready = alive('friendly')
          .filter(u => u.cooldown === 0)
          .sort((a, b) => a.id.localeCompare(b.id));

        for (const attacker of ready) {
          const candidates = candidatesFor(attacker)
            .filter(target => virtualHp.get(target.id) > 0)
            .sort((a, b) =>
              virtualHp.get(a.id) - virtualHp.get(b.id) ||
              a.hp - b.hp ||
              a.id.localeCompare(b.id)
            );

          if (candidates.length) {
            const target = candidates[0];
            actions.push({ attacker, target });
            virtualHp.set(target.id, Math.max(0, virtualHp.get(target.id) - damage(attacker, target)));
          }
        }
        return actions;
      }

      function enemyActions() {
        const actions = [];
        const ready = alive('enemy').filter(u => u.cooldown === 0);

        for (const attacker of ready) {
          const candidates = candidatesFor(attacker).sort((a, b) =>
            distance(attacker, a) - distance(attacker, b) || a.id.localeCompare(b.id)
          );
          if (candidates.length) actions.push({ attacker, target: candidates[0] });
        }
        return actions;
      }

      function moveTowardGoal(unit) {
        const dx = GOAL.x - unit.x;
        const dy = GOAL.y - unit.y;
        const d = Math.hypot(dx, dy);
        if (d <= 1e-9) return;
        const step = Math.min(unit.speed * WORLD_SCALE, d);
        unit.x += dx / d * step;
        unit.y += dy / d * step;
      }

      function step() {
        if (state.ended) return;

        const currentTick = state.tick;
        const friendlyActions = strategySelect.value === 'default' ? defaultActions() : modelActions();
        const hostileActions = enemyActions();
        const actions = [...friendlyActions, ...hostileActions];
        const attackedIds = new Set(actions.map(a => a.attacker.id));
        const incoming = new Map();

        for (const action of actions) {
          incoming.set(action.target.id, (incoming.get(action.target.id) || 0) + damage(action.attacker, action.target));
        }

        state.attacks = actions.map(a => ({
          from: { x: a.attacker.x, y: a.attacker.y },
          to: { x: a.target.x, y: a.target.y },
          label: `${a.attacker.id}→${a.target.id}`
        }));

        for (const target of state.units) {
          if (target.alive && incoming.has(target.id)) {
            target.hp -= incoming.get(target.id);
          }
        }

        const deaths = [];
        for (const unit of state.units) {
          if (unit.alive && unit.hp <= 0) {
            unit.hp = 0;
            unit.alive = false;
            deaths.push(unit.id);
          }
        }

        const friendlyAlive = alive('friendly').length;
        const enemyAlive = alive('enemy').length;
        state.ended = friendlyAlive === 0 || enemyAlive === 0;
        if (state.ended) {
          state.winner = friendlyAlive > 0 ? 'friendly' : enemyAlive > 0 ? 'enemy' : 'draw';
        }

        for (const unit of state.units) {
          if (!unit.alive) continue;
          if (attackedIds.has(unit.id)) {
            unit.cooldown = Math.max(0, unit.interval - 1);
          } else {
            unit.cooldown = Math.max(0, unit.cooldown - 1);
            if (!state.ended && candidatesFor(unit).length === 0) moveTowardGoal(unit);
          }
        }

        const actionText = actions.length
          ? actions.map(a => `${a.attacker.id}→${a.target.id}(${damage(a.attacker, a.target)})`).join('，')
          : '无攻击；射程内无敌人的单位向 G 移动，其余单位保持原位';
        const deathText = deaths.length ? `；${deaths.join('、')} 死亡` : '';
        state.log.push(`Tick ${currentTick}：${actionText}${deathText}`);
        state.tick += 1;

        if (state.ended) stop();
        render();
      }

      function totalHp(team) {
        return alive(team).reduce((sum, unit) => sum + unit.hp, 0);
      }

      function statusText() {
        if (state.ended) {
          if (state.winner === 'friendly') return '己方胜利';
          if (state.winner === 'enemy') return '敌方胜利';
          return '双方全灭';
        }
        return state.attacks.length ? '交战中' : '移动中';
      }

      function reset() {
        stop();
        state = createScenario();
        resultBox.hidden = true;
        render();
      }

      function play() {
        if (state.ended) reset();
        playing = true;
        playButton.textContent = '暂停';
        runLoop();
      }

      function stop() {
        playing = false;
        playButton.textContent = '播放';
        if (timer) clearTimeout(timer);
        timer = null;
      }

      function runLoop() {
        if (!playing || state.ended) return;
        step();
        if (playing && !state.ended) {
          timer = setTimeout(runLoop, Number(speedSelect.value));
        }
      }

      function resizeCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.round(WIDTH * dpr);
        canvas.height = Math.round(HEIGHT * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      function drawGrid() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.strokeStyle = css('--border');
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 1;
        for (let x = 50; x < WIDTH; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 50; y < HEIGHT; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function drawGoal() {
        ctx.strokeStyle = css('--goal');
        ctx.fillStyle = css('--goal');
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(GOAL.x, GOAL.y, 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(GOAL.x, GOAL.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '600 14px Segoe UI, Microsoft YaHei, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('G', GOAL.x, GOAL.y - 27);
      }

      function drawRange(unit) {
        ctx.strokeStyle = unit.team === 'friendly' ? css('--friendly') : css('--enemy');
        ctx.globalAlpha = unit.cooldown === 0 ? 0.23 : 0.1;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 7]);
        ctx.beginPath();
        ctx.arc(unit.x, unit.y, unit.range * WORLD_SCALE, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }

      function drawUnit(unit) {
        const color = unit.team === 'friendly' ? css('--friendly') : css('--enemy');
        const soft = unit.team === 'friendly' ? css('--friendly-soft') : css('--enemy-soft');

        ctx.globalAlpha = unit.alive ? 1 : 0.2;
        ctx.fillStyle = soft;
        ctx.beginPath();
        ctx.arc(unit.x, unit.y, 28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(unit.x, unit.y, 20, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = '600 13px Segoe UI, Microsoft YaHei, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(unit.id, unit.x, unit.y);

        const barX = unit.x - 30;
        const barY = unit.y - 40;
        ctx.fillStyle = css('--border');
        ctx.fillRect(barX, barY, 60, 7);
        ctx.fillStyle = unit.hp / unit.maxHp > 0.35 ? css('--success') : css('--enemy');
        ctx.fillRect(barX, barY, 60 * Math.max(0, unit.hp / unit.maxHp), 7);

        ctx.fillStyle = css('--text');
        ctx.font = '12px Segoe UI, Microsoft YaHei, sans-serif';
        ctx.fillText(`${unit.hp}/${unit.maxHp}`, unit.x, unit.y + 34);
        ctx.fillStyle = css('--muted');
        ctx.fillText(unit.cooldown === 0 ? 'Ready' : `CD ${unit.cooldown}`, unit.x, unit.y + 50);
        ctx.globalAlpha = 1;
      }

      function drawAttacks() {
        ctx.strokeStyle = css('--attack');
        ctx.fillStyle = css('--attack');
        ctx.lineWidth = 4;
        ctx.font = '600 12px Segoe UI, Microsoft YaHei, sans-serif';
        ctx.textAlign = 'center';
        for (const attack of state.attacks) {
          ctx.beginPath();
          ctx.moveTo(attack.from.x, attack.from.y);
          ctx.lineTo(attack.to.x, attack.to.y);
          ctx.stroke();
          const midX = (attack.from.x + attack.to.x) / 2;
          const midY = (attack.from.y + attack.to.y) / 2;
          ctx.fillText(attack.label, midX, midY - 8);
        }
      }

      function renderLog() {
        eventLog.replaceChildren();
        state.log.forEach((entry, index) => {
          const item = document.createElement('li');
          item.textContent = entry;
          if (index === state.log.length - 1) item.className = 'latest';
          eventLog.appendChild(item);
        });
        eventLog.scrollTop = eventLog.scrollHeight;
      }

      function render() {
        if (!state) return;
        strategyNote.textContent = strategyDescriptions[strategySelect.value];
        tickValue.textContent = state.tick;
        friendlyHpValue.textContent = totalHp('friendly');
        enemyAliveValue.textContent = alive('enemy').length;
        statusValue.textContent = statusText();
        stepButton.disabled = state.ended;

        drawGrid();
        drawGoal();
        alive().forEach(drawRange);
        state.units.forEach(drawUnit);
        drawAttacks();
        renderLog();

        if (state.ended) {
          const label = strategySelect.value === 'default' ? '默认就近攻击算法' : '大模型优化集火算法';
          resultBox.textContent = `${label}结束于 tick ${state.tick - 1}，己方最终总生命值为 ${totalHp('friendly')}。切换策略并重置，可直接比较结果。`;
          resultBox.hidden = false;
        } else {
          resultBox.hidden = true;
        }
      }

      playButton.addEventListener('click', () => playing ? stop() : play());
      stepButton.addEventListener('click', step);
      resetButton.addEventListener('click', reset);
      strategySelect.addEventListener('change', reset);
      speedSelect.addEventListener('change', () => {
        if (playing) {
          clearTimeout(timer);
          timer = setTimeout(runLoop, Number(speedSelect.value));
        }
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
      new ResizeObserver(resizeCanvas).observe(canvas);

      reset();
      resizeCanvas();
    })();
  </script>
</body>
</html>
