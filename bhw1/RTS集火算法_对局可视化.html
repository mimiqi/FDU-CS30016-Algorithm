<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RTS 集火算法对局可视化</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #657087;
      --border: #d9dfeb;
      --friendly: #2675d8;
      --friendly-soft: rgba(38, 117, 216, 0.14);
      --enemy: #d24a43;
      --enemy-soft: rgba(210, 74, 67, 0.14);
      --goal: #8c62d5;
      --attack: #e4a11b;
      --success: #2e8b57;
      --shadow: 0 12px 32px rgba(24, 34, 55, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151d;
        --panel: #1a202b;
        --text: #edf1f7;
        --muted: #aab3c3;
        --border: #343d4d;
        --friendly: #64a8ff;
        --friendly-soft: rgba(100, 168, 255, 0.14);
        --enemy: #ff7770;
        --enemy-soft: rgba(255, 119, 112, 0.14);
        --goal: #b895ff;
        --attack: #ffd166;
        --success: #70d69b;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 22px auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 650;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar,
    .metrics,
    .layout {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar {
      align-items: end;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    select { padding: 0 34px 0 10px; }

    button {
      padding: 0 15px;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--friendly);
      background: var(--friendly);
      color: #fff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--friendly), transparent 60%);
      outline-offset: 2px;
    }

    .strategy-note {
      flex: 1 1 280px;
      align-self: center;
      color: var(--muted);
      line-height: 1.45;
      font-size: 14px;
    }

    .metrics {
      margin: 12px 0;
    }

    .metric {
      flex: 1 1 170px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 22px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .layout { align-items: stretch; }

    .battlefield-panel {
      flex: 3 1 620px;
      min-width: 0;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 900 / 450;
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel), var(--bg) 45%);
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 11px; height: 11px; border-radius: 50%; }
    .swatch.friendly { background: var(--friendly); }
    .swatch.enemy { background: var(--enemy); }
    .swatch.goal { background: var(--goal); }

    .log-panel {
      flex: 1 1 280px;
      min-width: 0;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .log-panel h2 {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 650;
    }

    #eventLog {
      margin: 0;
      padding-left: 22px;
      max-height: 430px;
      overflow: auto;
      color: var(--muted);
      line-height: 1.5;
      font-size: 13px;
    }

    #eventLog li { margin-bottom: 8px; }
    #eventLog li.latest { color: var(--text); font-weight: 600; }

    .result {
      margin-top: 12px;
      padding: 10px 12px;
      border-left: 4px solid var(--success);
      background: color-mix(in srgb, var(--success), transparent 90%);
      line-height: 1.5;
    }

    .result[hidden] { display: none; }

    @media (max-width: 720px) {
      main { width: min(100% - 18px, 680px); margin: 12px auto; }
      .toolbar { align-items: stretch; }
      .toolbar label { flex: 1 1 100%; }
      .toolbar button { flex: 1 1 140px; }
      .strategy-note { flex-basis: 100%; }
      .battlefield-panel, .log-panel { flex-basis: 100%; }
    }
    .unit-panel { margin-top: 14px; }
    .unit-panel h2 { font-size: 17px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
    select { max-width: 100%; min-width: 0; }
    .toolbar label { min-width: 0; }
    #scenarioNote { margin: 14px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>RTS 集火算法审计</h1>
    <p class="subtitle">双方单位属性完全相同：生命 55、攻击 10、射程 6、移速 2、攻击间隔 2 tick。射程内存在敌人时单位停止移动；敌方始终就近攻击。</p>

    <section class="toolbar" aria-label="模拟控制">
      <label>对局场景
        <select id="scenarioSelect">
          <option value="counterexample">同属性反例：攻击时机影响终局</option>
          <option value="demo">基础演示：集火优于就近攻击</option>
        </select>
      </label>
      <label>
        己方策略
        <select id="strategySelect">
          <option value="default">默认算法：就近攻击</option>
          <option value="model" selected>旧模型算法：最低生命值集火</option>
          <option value="corrected">人工修正版：精确决策</option>
        </select>
      </label>
      <label>
        播放速度
        <select id="speedSelect">
          <option value="1100">慢速</option>
          <option value="700" selected>正常</option>
          <option value="350">快速</option>
        </select>
      </label>
      <button id="playButton" class="primary" type="button">播放</button>
      <button id="stepButton" type="button">下一 tick</button>
      <button id="resetButton" type="button">重置</button>
      <div id="strategyNote" class="strategy-note"></div>
    </section>

    <p id="scenarioNote" class="subtitle"></p>
    <p id="criticalNote" class="result" hidden>即将处理 tick 3：旧模型选择 E1；精确策略选择 E2。观察 tick 8—9 的 F1。</p>
    <section class="metrics" aria-label="当前状态">
      <div class="metric"><span>已结算 tick</span><strong id="tickValue">0</strong></div>
      <div class="metric"><span>己方总生命值</span><strong id="friendlyHpValue">110</strong></div>
      <div class="metric"><span>敌方存活数</span><strong id="enemyAliveValue">2</strong></div>
      <div class="metric"><span>战斗状态</span><strong id="statusValue">移动中</strong></div>
    </section>

    <section class="layout">
      <div class="battlefield-panel">
        <canvas id="battlefield" role="img" aria-label="RTS 对局战场：蓝色为己方单位，红色为敌方单位，紫色为共同目标点"></canvas>
        <div class="legend" aria-label="图例">
          <span><i class="swatch friendly"></i>己方单位</span>
          <span><i class="swatch enemy"></i>敌方单位</span>
          <span><i class="swatch goal"></i>共同目标点 G</span>
          <span>虚线圆：攻击范围</span>
          <span>黄色箭头：本 tick 攻击</span>
          <span>小圆点为真实坐标，文字沿引线错开</span>
        </div>
        <div id="resultBox" class="result" aria-live="polite" hidden></div>
      </div>

      <aside class="log-panel">
        <h2>逐 tick 事件</h2>
        <ol id="eventLog" aria-live="polite"></ol>
      </aside>
    </section>
    <section class="unit-panel" aria-label="单位状态">
      <h2>下一 tick 开始状态</h2>
      <table><thead><tr><th>单位</th><th>生命</th><th>位置</th><th>攻击状态</th></tr></thead><tbody id="unitRows"></tbody></table>
    </section>
  </main>

  <script src="rts-core.js"></script>
  <script src="rts-scenarios.js"></script>
  <script src="rts-view.js"></script>
</body>
</html>
